# Mutations do Firebase Data Connect

# USUÁRIOS
mutation UpsertUser(
  $id: String!
  $email: String!
  $username: String
  $name: String!
  $role: String!
  $phone: String
  $avatarUrl: String
  $eventIds: [String!]
  $createdAt: String
) @auth(level: PUBLIC) {
  user_upsert(
    data: {
      id: $id
      email: $email
      username: $username
      name: $name
      role: $role
      phone: $phone
      avatarUrl: $avatarUrl
      eventIds: $eventIds
      createdAt: $createdAt
    }
  )
}

mutation DeleteUser($id: String!) @auth(level: PUBLIC) {
  user_delete(key: { id: $id })
}

# EVENTOS
mutation UpsertEvent(
  $id: String!
  $name: String!
  $code: String
  $startDate: String
  $endDate: String
  $description: String
  $status: String!
  $allowVolunteerRegistration: Boolean
  $openShiftVisibility: Boolean
  $autoGenerationEnabled: Boolean
  $headerImageUrl: String
  $footerImageUrl: String
  $adminUids: [String!]
  $createdAt: String
) @auth(level: PUBLIC) {
  event_upsert(
    data: {
      id: $id
      name: $name
      code: $code
      startDate: $startDate
      endDate: $endDate
      description: $description
      status: $status
      allowVolunteerRegistration: $allowVolunteerRegistration
      openShiftVisibility: $openShiftVisibility
      autoGenerationEnabled: $autoGenerationEnabled
      headerImageUrl: $headerImageUrl
      footerImageUrl: $footerImageUrl
      adminUids: $adminUids
      createdAt: $createdAt
    }
  )
}

mutation DeleteEvent($id: String!) @auth(level: PUBLIC) {
  event_delete(key: { id: $id })
}

